<!DOCTYPE html>
<html>
<head>
    <title>Мониторинг фьючерсов (исправленный)</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .exchange { margin-bottom: 30px; border: 1px solid #ddd; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background-color: #f8f9fa; }
        .status { padding: 5px 10px; border-radius: 4px; }
        .connected { background: #27ae60; color: white; }
        .disconnected { background: #e74c3c; color: white; }
    </style>
</head>
<body>
    <div class="exchange">
        <h2>Binance Futures <span class="status disconnected" id="binanceStatus">Отключено</span></h2>
        <table id="binanceTable">
            <thead>
                <tr>
                    <th>Символ</th>
                    <th>Сделок (15m)</th>
                    <th>Цена</th>
                </tr>
            </thead>
            <tbody id="binanceData"></tbody>
        </table>
    </div>

<script>
const MIN_TRADES = 1000; // Временно уменьшено для тестирования
const WINDOW_SIZE = 15 * 60 * 1000;
const MAX_SYMBOLS = 20;

class BinanceFuturesMonitor {
    constructor() {
        this.symbols = new Map();
        this.ws = null;
        this.statusElement = document.getElementById('binanceStatus');
        this.reconnectAttempts = 0;
        this.pingInterval = null;
    }

    async init() {
        await this.loadActiveSymbols();
        this.connectWebSocket();
        this.startMaintenanceTasks();
    }

    async loadActiveSymbols() {
        try {
            const response = await fetch('https://fapi.binance.com/fapi/v1/exchangeInfo');
            const data = await response.json();
            
            data.symbols
                .filter(s => s.status === 'TRADING' && 
                            s.contractType === 'PERPETUAL' &&
                            s.symbol.endsWith('USDT'))
                .slice(0, MAX_SYMBOLS)
                .forEach(symbolInfo => {
                    this.symbols.set(symbolInfo.symbol, {
                        trades: [],
                        price: 0,
                        lastUpdated: 0
                    });
                });

        } catch(error) {
            console.error('Ошибка загрузки символов:', error);
        }
    }

    connectWebSocket() {
        if(this.ws) this.ws.close();
        
        this.ws = new WebSocket('wss://fstream.binance.com/ws');
        
        this.ws.onopen = () => this.handleConnect();
        this.ws.onmessage = (e) => this.processMessage(e.data);
        this.ws.onerror = (e) => this.handleError(e);
        this.ws.onclose = (e) => this.handleClose(e);
    }

    handleConnect() {
        this.reconnectAttempts = 0;
        this.statusElement.className = 'status connected';
        this.statusElement.textContent = 'Подключено';
        this.subscribeToSymbols();
        this.startPing();
    }

    startPing() {
        this.pingInterval = setInterval(() => {
            if(this.ws.readyState === WebSocket.OPEN) {
                this.ws.send(JSON.stringify({ method: "PING" }));
            }
        }, 30000);
    }

    subscribeToSymbols() {
        const streams = Array.from(this.symbols.keys())
            .map(s => `${s.toLowerCase()}@aggTrade`);
        
        const subscribeMsg = JSON.stringify({
            method: "SUBSCRIBE",
            params: streams,
            id: Date.now()
        });
        
        this.ws.send(subscribeMsg);
    }

    processMessage(rawData) {
        try {
            const data = JSON.parse(rawData);
            if(data.e === 'aggTrade') {
                const symbol = data.s.toUpperCase();
                if(this.symbols.has(symbol)) {
                    const entry = this.symbols.get(symbol);
                    entry.trades.push(data.T);
                    entry.price = parseFloat(data.p);
                    entry.lastUpdated = Date.now();
                }
            }
        } catch(error) {
            console.error('Ошибка обработки сообщения:', error);
        }
    }

    startMaintenanceTasks() {
        // Очистка старых сделок
        setInterval(() => {
            const now = Date.now();
            this.symbols.forEach(entry => {
                entry.trades = entry.trades.filter(t => now - t < WINDOW_SIZE);
            });
            this.updateTable();
        }, 1000);

        // Проверка соединения
        setInterval(() => {
            if(this.ws.readyState !== WebSocket.OPEN) {
                this.reconnect();
            }
        }, 5000);
    }

    updateTable() {
        const tbody = document.getElementById('binanceData');
        const activeSymbols = Array.from(this.symbols.entries())
            .filter(([_, data]) => data.trades.length >= MIN_TRADES)
            .sort((a, b) => b[1].trades.length - a[1].trades.length);
        
        tbody.innerHTML = activeSymbols.map(([symbol, data]) => `
            <tr>
                <td>${symbol}</td>
                <td>${data.trades.length.toLocaleString()}</td>
                <td>${data.price.toFixed(4)}</td>
            </tr>
        `).join('');
    }

    handleError(event) {
        console.error('WebSocket error:', event);
        this.statusElement.className = 'status disconnected';
        this.statusElement.textContent = 'Ошибка соединения';
    }

    handleClose(event) {
        console.warn(`Соединение закрыто: ${event.code}`);
        clearInterval(this.pingInterval);
        this.reconnect();
    }

    reconnect() {
        const baseDelay = Math.min(5000 * (this.reconnectAttempts + 1), 30000);
        const delay = baseDelay + Math.random() * 5000;
        
        this.statusElement.textContent = `Переподключение через ${Math.round(delay/1000)}сек`;
        this.reconnectAttempts++;
        
        setTimeout(() => this.connectWebSocket(), delay);
    }
}

const monitor = new BinanceFuturesMonitor();
window.addEventListener('load', () => monitor.init());
</script>
</body>
</html>
