<!DOCTYPE html>
<html>
<head>
    <title>Мониторинг активных фьючерсов</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .exchange { margin-bottom: 30px; border: 1px solid #ddd; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background-color: #f8f9fa; }
        .status { padding: 5px 10px; border-radius: 4px; }
        .connected { background: #27ae60; color: white; }
        .disconnected { background: #e74c3c; color: white; }
        .highlight { background-color: #e8f5e9; }
    </style>
</head>
<body>
    <div class="exchange">
        <h2>Binance Futures <span class="status disconnected" id="binanceStatus">Отключено</span></h2>
        <table id="binanceTable">
            <thead>
                <tr>
                    <th>Символ</th>
                    <th>Сделок (15m)</th>
                    <th>Цена</th>
                    <th>Объем</th>
                </tr>
            </thead>
            <tbody id="binanceData"></tbody>
        </table>
    </div>

<script>
const MIN_TRADES = 100000; // 100k сделок
const WINDOW_SIZE = 15 * 60 * 1000; // 15 минут
const MAX_SYMBOLS = 50;

class FuturesMonitor {
    constructor() {
        this.symbols = new Map();
        this.ws = null;
        this.statusElement = document.getElementById('binanceStatus');
        this.reconnectAttempts = 0;
        this.lastUpdate = Date.now();
    }

    async init() {
        await this.loadSymbols();
        this.connectWebSocket();
        this.startMaintenance();
    }

    async loadSymbols() {
        try {
            const response = await fetch('https://fapi.binance.com/fapi/v1/exchangeInfo');
            const data = await response.json();
            
            data.symbols
                .filter(s => s.status === 'TRADING' 
                    && s.contractType === 'PERPETUAL'
                    && s.symbol.endsWith('USDT'))
                .slice(0, MAX_SYMBOLS)
                .forEach(s => {
                    this.symbols.set(s.symbol, {
                        trades: [],
                        price: 0,
                        volume: 0,
                        lastTradeTime: 0
                    });
                });
            
            console.log('Loaded symbols:', [...this.symbols.keys()]);
        } catch(error) {
            console.error('Error loading symbols:', error);
        }
    }

    connectWebSocket() {
        if(this.ws) this.ws.close();
        
        this.ws = new WebSocket('wss://fstream.binance.com/ws');
        
        this.ws.onopen = () => {
            this.reconnectAttempts = 0;
            this.statusElement.className = 'status connected';
            this.statusElement.textContent = 'Connected';
            this.subscribeToSymbols();
        };

        this.ws.onmessage = e => this.processTrade(e.data);
        this.ws.onerror = e => this.handleError(e);
        this.ws.onclose = e => this.handleDisconnect(e);
    }

    subscribeToSymbols() {
        const streams = [...this.symbols.keys()]
            .map(s => `${s.toLowerCase()}@aggTrade`);
        
        this.ws.send(JSON.stringify({
            method: "SUBSCRIBE",
            params: streams,
            id: Date.now()
        }));
    }

    processTrade(data) {
        try {
            const { e: type, s: symbol, p: price, q: quantity, T: timestamp } = JSON.parse(data);
            
            if(type !== 'aggTrade') return;
            
            const normalizedSymbol = symbol.toUpperCase();
            if(!this.symbols.has(normalizedSymbol)) return;

            const entry = this.symbols.get(normalizedSymbol);
            entry.trades.push({
                timestamp,
                price: parseFloat(price),
                quantity: parseFloat(quantity)
            });
            
            entry.price = parseFloat(price);
            entry.volume += parseFloat(quantity);
            entry.lastTradeTime = Date.now();
            
        } catch(error) {
            console.error('Trade processing error:', error);
        }
    }

    startMaintenance() {
        // Очистка старых сделок
        setInterval(() => {
            const now = Date.now();
            this.symbols.forEach(entry => {
                entry.trades = entry.trades.filter(t => now - t.timestamp < WINDOW_SIZE);
            });
            this.updateTable();
        }, 1000);

        // Проверка соединения
        setInterval(() => {
            if(this.ws.readyState !== WebSocket.OPEN) {
                this.reconnect();
            }
        }, 5000);
    }

    updateTable() {
        const activeSymbols = [...this.symbols.entries()]
            .filter(([_, data]) => data.trades.length >= MIN_TRADES)
            .sort((a, b) => b[1].trades.length - a[1].trades.length);

        const tbody = document.getElementById('binanceData');
        tbody.innerHTML = activeSymbols.map(([symbol, data]) => `
            <tr class="${Date.now() - data.lastTradeTime < 10000 ? 'highlight' : ''}">
                <td>${symbol}</td>
                <td>${data.trades.length.toLocaleString()}</td>
                <td>${data.price.toFixed(4)}</td>
                <td>${data.volume.toFixed(0)}</td>
            </tr>
        `).join('');
    }

    handleError(event) {
        console.error('WebSocket error:', event);
        this.statusElement.className = 'status disconnected';
        this.statusElement.textContent = 'Connection Error';
    }

    handleDisconnect(event) {
        console.warn(`Disconnected: ${event.code}`);
        this.statusElement.className = 'status disconnected';
        this.statusElement.textContent = 'Reconnecting...';
        setTimeout(() => this.connectWebSocket(), Math.min(1000 * 2 ** this.reconnectAttempts, 30000));
        this.reconnectAttempts++;
    }
}

const monitor = new FuturesMonitor();
window.addEventListener('load', () => monitor.init());
</script>
</body>
</html>
