<!DOCTYPE html>
<html>
<head>
    <title>Binance Futures Advanced Monitor</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            margin: 20px; 
            background: #0f172a; 
            color: #f8fafc; 
        }
        .container { 
            max-width: 1800px; 
            margin: 0 auto; 
        }
        .exchange { 
            background: #1e293b; 
            padding: 1.5rem; 
            border-radius: 0.75rem; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 1rem;
        }
        th, td { 
            padding: 0.75rem 1rem; 
            text-align: right; 
            border-bottom: 1px solid #334155; 
        }
        th { 
            background: #1e293b; 
            position: sticky; 
            top: 0; 
            cursor: pointer;
            transition: background 0.2s;
        }
        th:hover {
            background: #2d3748;
        }
        .status { 
            padding: 0.25rem 0.75rem; 
            border-radius: 9999px; 
            font-size: 0.875rem; 
            font-weight: 500; 
        }
        .connected { background: #16a34a; }
        .connecting { background: #ca8a04; }
        .error { background: #dc2626; }
        .high-activity {
            background: #4c1d1d !important;
            position: relative;
        }
        .high-activity::after {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 3px;
            background: #ef4444;
            box-shadow: 0 0 8px #ef4444;
        }
        .positive { color: #22c55e !important; }
        .negative { color: #ef4444 !important; }
        td:first-child { 
            text-align: left; 
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .sorted-asc::after { 
            content: ' ▴'; 
            font-size: 0.75em; 
            margin-left: 0.25rem;
        }
        .sorted-desc::after { 
            content: ' ▾'; 
            font-size: 0.75em; 
            margin-left: 0.25rem;
        }
        .copied {
            background: #334155 !important;
            color: #fff !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="exchange">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h2 style="margin: 0; font-size: 1.5rem;">Binance Futures Monitor</h2>
                <span class="status connecting" id="status">CONNECTING...</span>
            </div>
            <table>
                <thead>
                    <tr>
                        <th onclick="sortTable('symbol')">Symbol</th>
                        <th onclick="sortTable('trades1s')">Trades/s</th>
                        <th onclick="sortTable('trades5m')">Trades (5m)</th>
                        <th onclick="sortTable('trades15m')">Trades (15m)</th>
                        <th onclick="sortTable('price')">Price</th>
                        <th onclick="sortTable('dailyTrades')">24h Trades</th>
                        <th onclick="sortTable('dailyChange')">24h Chg%</th>
                        <th onclick="sortTable('realtimeVolume')">Live Volume</th>
                    </tr>
                </thead>
                <tbody id="data"></tbody>
            </table>
        </div>
    </div>

<script>
class FuturesMonitor {
    constructor() {
        this.symbols = new Map();
        this.ws = null;
        this.statusElement = document.getElementById('status');
        this.sortState = { field: 'trades1s', direction: 'desc' };
        this.updateInterval = 50;
        this.lastRender = 0;
        this.reconnectAttempts = 0;
    }

    async init() {
        await this.loadSymbols();
        await this.load24hData();
        this.initWebSocket();
        this.startRenderLoop();
    }

    async loadSymbols() {
        try {
            const response = await fetch('https://fapi.binance.com/fapi/v1/exchangeInfo');
            const data = await response.json();
            this.processSymbols(data.symbols);
        } catch(error) {
            console.error('Error loading symbols:', error);
            setTimeout(() => this.init(), 2000);
        }
    }

    processSymbols(symbols) {
        symbols.filter(s => 
            s.status === 'TRADING' &&
            s.contractType === 'PERPETUAL' &&
            s.symbol.endsWith('USDT')
        ).forEach(s => {
            this.symbols.set(s.symbol, {
                trades: [],
                price: 0,
                volume: 0,
                dailyVolume: 0,
                dailyChange: 0,
                dailyTrades: 0,
                lastUpdate: 0
            });
        });
    }

    async load24hData() {
        try {
            const response = await fetch('https://fapi.binance.com/fapi/v1/ticker/24hr');
            const data = await response.json();
            data.forEach(ticker => {
                if(this.symbols.has(ticker.symbol)) {
                    const symbol = this.symbols.get(ticker.symbol);
                    symbol.dailyVolume = parseFloat(ticker.quoteVolume) || 0;
                    symbol.dailyChange = parseFloat(ticker.priceChangePercent) || 0;
                    symbol.dailyTrades = parseInt(ticker.count) || 0;
                }
            });
        } catch(error) {
            console.error('Error loading 24h data:', error);
        }
    }

    initWebSocket() {
        if(this.ws) this.ws.close();
        this.ws = new WebSocket('wss://fstream.binance.com/stream');
        
        this.ws.onopen = () => {
            this.statusElement.className = 'status connected';
            this.statusElement.textContent = 'LIVE';
            this.subscribeToSymbols();
            this.reconnectAttempts = 0;
        };

        this.ws.onmessage = e => this.handleWSMessage(JSON.parse(e.data));
        this.ws.onerror = e => this.handleError(e);
        this.ws.onclose = e => this.handleDisconnect(e);
    }

    subscribeToSymbols() {
        const symbols = [...this.symbols.keys()];
        const streams = symbols.map(s => `${s.toLowerCase()}@aggTrade`);
        
        const batchSize = 200;
        for(let i = 0; i < streams.length; i += batchSize) {
            this.ws.send(JSON.stringify({
                method: 'SUBSCRIBE',
                params: streams.slice(i, i + batchSize),
                id: Date.now()
            }));
        }
    }

    handleWSMessage(data) {
        if(!data?.stream?.includes('@aggTrade')) return;
        
        const symbol = data.data.s.toUpperCase();
        const entry = this.symbols.get(symbol);
        if(!entry) return;

        const timestamp = Date.now();
        const price = parseFloat(data.data.p);
        const qty = parseFloat(data.data.q);

        entry.trades.push(timestamp);
        entry.price = price;
        entry.volume += qty * price;
        entry.lastUpdate = timestamp;
    }

    startRenderLoop() {
        const render = () => {
            if(Date.now() - this.lastRender >= this.updateInterval) {
                this.renderTable();
                this.lastRender = Date.now();
            }
            requestAnimationFrame(render);
        };
        render();
    }

    getProcessedData() {
        const now = Date.now();
        return [...this.symbols.entries()].map(([symbol, data]) => ({
            symbol,
            trades1s: data.trades.filter(t => now - t <= 1000).length,
            trades5m: data.trades.filter(t => now - t <= 300000).length,
            trades15m: data.trades.filter(t => now - t <= 900000).length,
            price: data.price,
            dailyVolume: data.dailyVolume,
            dailyChange: data.dailyChange,
            dailyTrades: data.dailyTrades,
            realtimeVolume: data.volume
        }));
    }

    renderTable() {
        const tbody = document.getElementById('data');
        const data = this.getProcessedData();
        this.sortData(data);
        
        tbody.innerHTML = data.map(item => `
            <tr${item.trades1s > 150 ? ' class="high-activity"' : ''} 
                data-symbol="${item.symbol}">
                <td onclick="handleSymbolClick('${item.symbol.replace(/'/g, "\\'")}', this)">
                    ${item.symbol}
                </td>
                <td>${item.trades1s.toLocaleString()}</td>
                <td>${item.trades5m.toLocaleString()}</td>
                <td>${item.trades15m.toLocaleString()}</td>
                <td class="${this.getPriceChangeClass(item.symbol, item.price)}">
                    $${item.price.toFixed(4)}
                </td>
                <td>${item.dailyTrades.toLocaleString()}</td>
                <td class="${item.dailyChange >= 0 ? 'positive' : 'negative'}">
                    ${item.dailyChange.toFixed(2)}%
                </td>
                <td>$${(item.realtimeVolume / 1e6).toFixed(2)}M</td>
            </tr>
        `).join('');

        this.updateSortIndicators();
    }

    getPriceChangeClass(symbol, currentPrice) {
        const prevPrice = this.symbols.get(symbol).prevPrice || currentPrice;
        this.symbols.get(symbol).prevPrice = currentPrice;
        return currentPrice >= prevPrice ? 'positive' : 'negative';
    }

    updateSortIndicators() {
        document.querySelectorAll('th').forEach(th => {
            th.classList.remove('sorted-asc', 'sorted-desc');
            const field = th.onclick.toString().match(/sortTable\('(.*?)'\)/)[1];
            if(field === this.sortState.field) {
                th.classList.add(`sorted-${this.sortState.direction}`);
            }
        });
    }

    sortData(data) {
        const { field, direction } = this.sortState;
        const modifier = direction === 'asc' ? 1 : -1;

        data.sort((a, b) => {
            if(field === 'symbol') return a.symbol.localeCompare(b.symbol) * modifier;
            return (a[field] - b[field]) * modifier;
        });
    }

    sortTable(field) {
        if(this.sortState.field === field) {
            this.sortState.direction = this.sortState.direction === 'asc' ? 'desc' : 'asc';
        } else {
            this.sortState.field = field;
            this.sortState.direction = 'desc';
        }
        this.renderTable();
    }

    handleError(event) {
        console.error('WebSocket Error:', event);
        this.statusElement.className = 'status error';
        this.statusElement.textContent = 'ERROR';
    }

    handleDisconnect(event) {
        console.warn('Disconnected:', event);
        this.scheduleReconnect();
    }

    scheduleReconnect() {
        const delay = Math.min(5000 * Math.pow(2, this.reconnectAttempts), 30000);
        this.reconnectAttempts++;
        
        this.statusElement.className = 'status connecting';
        this.statusElement.textContent = `RECONNECTING IN ${Math.ceil(delay/1000)}S`;
        
        setTimeout(() => this.initWebSocket(), delay);
    }
}

function handleSymbolClick(symbol, element) {
    copyToClipboard(symbol, element);
}

function copyToClipboard(text, element) {
    // Пробуем современный API
    if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => {
            showCopiedFeedback(element);
        }).catch(err => {
            console.error('Clipboard API error:', err);
            fallbackCopy(text, element);
        });
    } else {
        // Fallback для старых браузеров
        fallbackCopy(text, element);
    }
}

function fallbackCopy(text, element) {
    const tempInput = document.createElement('textarea');
    tempInput.value = text;
    tempInput.style.position = 'fixed';
    tempInput.style.opacity = 0;
    document.body.appendChild(tempInput);
    
    try {
        tempInput.select();
        tempInput.setSelectionRange(0, 99999);
        document.execCommand('copy');
        showCopiedFeedback(element);
    } catch (err) {
        console.error('Fallback copy error:', err);
        alert('Скопируйте вручную: ' + text);
    } finally {
        document.body.removeChild(tempInput);
    }
}

function showCopiedFeedback(element) {
    element.classList.add('copied');
    setTimeout(() => {
        element.classList.remove('copied');
    }, 200);
}

const monitor = new FuturesMonitor();
window.sortTable = (field) => monitor.sortTable(field);
window.addEventListener('load', () => monitor.init());
</script>
</body>
</html>
